databases:
  - name: laravel-api-db
    databaseName: laravel_api
    user: laravel_api

services:
  - type: web
    name: laravel-api
    env: php
    buildCommand: "composer install --no-dev --optimize-autoloader && npm install && npm run build"
    startCommand: "php artisan serve --host=0.0.0.0 --port=$PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"